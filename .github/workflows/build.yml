name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 上传 Release 需要 contents: write（默认 GITHUB_TOKEN 是只读的，不加会 403）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 镜像已预装 Android SDK，只需补齐需要的 platform 与 build-tools
      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # 只安装缺失的组件；不安装已废弃的 "tools" 包
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$SDK_ROOT/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # 仓库配置了 KEYSTORE_BASE64 等 secrets 时自动签名，否则产出未签名 APK。
      # secrets 不能直接写进 if 表达式，所以先转成环境变量再判断。
      - name: Prepare signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK
        if: steps.sign.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out QQBot-signed.apk \
            app/build/outputs/apk/release/QQBot.apk
          rm -f release.jks

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f QQBot-signed.apk ]; then
            # 固定名 + 带版本名，方便直接用固定链接下载最新版
            cp QQBot-signed.apk "dist/QQBot.apk"
            cp QQBot-signed.apk "dist/QQBot-v${VERSION}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/release/QQBot.apk "dist/QQBot-unsigned-${VERSION}.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQBot-apk
          path: dist/*.apk
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      # ---------- 自动发布到 Releases ----------
      # 每次推到 main/master，都会更新一个「latest」滚动 Release，
      # 里面的 QQBot.apk 始终是最新构建；打 v* 标签则额外发正式版本。

      - name: Publish rolling release (latest)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "QQBot 最新构建 (v${{ steps.apk.outputs.version }})"
          body: |
            QQBot 最新自动构建

            - 版本：${{ steps.apk.outputs.version }} (versionCode ${{ steps.apk.outputs.code }})
            - 提交：${{ github.sha }}
            - 构建：[${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            下载 `QQBot.apk` 直接安装（已签名）。
          files: |
            dist/QQBot.apk
            dist/QQBot-v${{ steps.apk.outputs.version }}.apk
          prerelease: false
          make_latest: true

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QQBot.apk
            dist/QQBot-v${{ steps.apk.outputs.version }}.apk
          generate_release_notes: true
